# =============================================================================
# Бюджет стационарных шумов численной модели.
# Дипломная работа, практическая часть, таблица 2.6 (раздел 2.7, sec:noise-model).
#
# По методологии диплома бюджет единый для обеих конфигураций (FTIR-эталон и
# QD-платформа): это изолирует влияние строения матрицы отклика A (число и
# расположение каналов, разрешение) от уровня шумового фона. При одинаковом C_n
# различие между платформами определяется только матрицей A.
#
# Все параметры — репрезентативные точки внутри диапазонов табл. 2.5 раздела
# теоретической части (Cn-params); конкретные численные значения сведены здесь.
#
# Соответствие полей файлу spectrolib/noise.py:
#   thermal_sigma        ↔ σ_T теплового шума (read + dark), δ_kl·σ_T²
#   shot_n_photons_max   ↔ N_k^(0) — число фотонов при T=1, вклад δ_kl·T_k/N_k^(0)
#   colored_sigma        ↔ σ_col установившегося СКО цветного процесса AR(1)
#   colored_ar           ↔ ρ коэффициент авторегрессии (σ_col²·ρ^|k-l|)
#
# По табл. 2.6 численные значения:
#   * Дробовой:  N^(0) = 1e6 e⁻;  σ_shot|_{T=1} = 1/√(N^(0)) = 1e-3
#   * Тепловой:  σ_read=5 e⁻, μ_d·τ_int=100 e⁻ ⇒
#                σ_T = √(σ_read² + μ_d·τ_int) / N^(0)
#                    = √(25 + 100) / 1e6 ≈ 1.118e-5
#   * Цветной AR(1):  σ_col = 1e-3,  ρ = 0.3
#
# При выбранном бюджете в OD-пространстве на каналах слабого поглощения
# суммарное СКО шума ≈ √(σ_shot² + σ_col²) ≈ 1.4e-3 ⇒ SNR ~10³ на одно
# измерение (до усреднения по N выдохам, §2.8).
#
# Дрейф базовой линии, периодические наводки и одиночные выбросы в C_n не
# входят (обрабатываются как nuisance-подпространство / отдельные шаги
# препроцессинга, см. §2.7 и subsec:noise-physical) — соответствующие поля
# здесь не задаются и шумовая модель их не добавляет.
# =============================================================================

name: "Stationary noise budget (table 2.6)"
reference: |
  Hamamatsu Si Detectors handbook; Holst & Lomheim, Electro-Optical
  Imaging Detector Arrays for High-Resolution Imaging; Werle 1998 (AOPC).
notes: >
  Единый бюджет для FTIR-эталона и QD-платформы. См. §2.7 практической части
  и обоснование в footnote к табл. 2.6.

# --- 1. Дробовой (фотонный) шум — δ_kl · T_k / N_k^(0) ---
shot_n_photons_max: 1.0e+6     # e⁻; даёт σ_shot|_{T=1} = 1e-3

# --- 2. Тепловой шум (read + dark) — δ_kl · σ_T² ---
# σ_T = √(σ_read² + μ_d·τ_int) / N^(0) = √(25 + 100) / 1e6 ≈ 1.118e-5
thermal_sigma: 1.118e-5

# --- 3. Цветной AR(1) — σ_col² · ρ^|k-l| ---
colored_sigma: 1.0e-3
colored_ar: 0.3

# --- 4-6. Не входят в стационарный C_n (см. подпись к табл. 2.6) ---
# drift_amplitude, periodic, spike_rate — намеренно не заданы.
