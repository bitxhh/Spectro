# Пример биомаркерной панели для отладки
# Использует только молекулы, гарантированно поддерживаемые HITRAN-обёрткой
# spectrolib (см. spectrolib.hitran.MOLECULE_IDS).
#
# Внимание: концентрации здесь — иллюстративные, не научно валидированные.
# Для настоящего исследования рака лёгких нужна панель, основанная на
# Phillips, Hanna, Risby и др. — она будет включать альдегиды (C5-C9),
# которые есть в HITRAN частично. Для них потребуется расширить
# MOLECULE_IDS в spectrolib/hitran.py.

name: "Демо-панель: основные газы выдоха"
reference: "Иллюстративная панель для тестов"
notes: >
  Ориентировочные концентрации основных газов в выдыхаемом воздухе
  здорового человека. Не использовать для научных выводов.

conditions:
  T_K: 310           # температура тела
  p_atm: 1.0
  L_cm: 1000         # multipass cell, эффективная длина 10 м
  diluent: {air: 1.0}

biomarkers:
  - name: H2O
    c_ppm: 50000     # ~5%, типичный уровень влажности выдоха
    wavelength_nm: 1380
    source: "выдох ~5% H2O"

  - name: CO2
    c_ppm: 40000     # ~4%, типичная концентрация в выдохе
    wavelength_nm: 4300
    source: "выдох ~4% CO2"

  - name: CO
    c_ppm: 1.5       # курильщики: 5-20 ppm, некурящие: <1-2 ppm
    wavelength_nm: 4666
    source: "Risby & Solga 2006"

  - name: NH3
    c_ppm: 0.5       # маркер печёночной/почечной недостаточности
    wavelength_nm: 10500
    source: "Davies 1997"

  - name: CH4
    c_ppm: 8         # вариативно: 1-50 ppm в зависимости от микробиоты
    wavelength_nm: 3300
    source: "Bond 1971"

  - name: "NO"       # обязательно в кавычках — иначе YAML сделает False
    c_ppm: 0.025     # 25 ppb, маркер воспаления (астма повышает в 3-5×)
    wavelength_nm: 5263
    source: "ATS/ERS guidelines 2005"
