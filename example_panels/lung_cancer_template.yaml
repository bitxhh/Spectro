# ШАБЛОН панели биомаркеров рака лёгких
# Это заготовка для научной панели, которую нужно заполнить реальными
# данными из публикаций. Концентрации ниже — ОРИЕНТИРОВОЧНЫЕ из обзоров,
# обязательно сверить с первоисточниками перед использованием.
#
# !!! Большинство альдегидов C5-C9 НЕ ПРИСУТСТВУЮТ в текущей версии
# spectrolib.hitran.MOLECULE_IDS (там только H2O, CO2, O3, N2O, CO, CH4,
# O2, NO, NO2, NH3). Для использования этой панели нужно:
#
#   1. Проверить, есть ли молекула в HITRAN по hitran.org/lbl/
#   2. Добавить её в MOLECULE_IDS с правильным (M, I) — molecule_id и
#      isotopologue_id
#   3. Скачать таблицу через fetch_molecule() в нужном диапазоне
#
# Для альдегидов C5+ HITRAN может не содержать данных в видимом диапазоне —
# тогда нужно либо использовать другой диапазон (ИК), либо подключать
# дополнительные базы (PNNL, NIST).

name: "Lung cancer biomarkers panel (template)"
reference: |
  Phillips M et al, Cancer Biomarkers (2003).
  Hanna GB et al, JAMA Oncology (2019) — мета-анализ.
  Risby TH, Solga SF, Appl Phys B (2006) — обзор по летучим биомаркерам.
notes: >
  ШАБЛОН. Концентрации иллюстративные, требуют верификации по
  первоисточникам. Большинство альдегидов отсутствуют в текущей
  MOLECULE_IDS — расширить перед использованием.

conditions:
  T_K: 310
  p_atm: 1.0
  L_cm: 3000          # 30 м multipass — реалистично для альдегидов на ppb
  diluent: {air: 1.0}

biomarkers:
  # Малые молекулы — есть в HITRAN, можно использовать сразу
  - name: "NO"        # обязательно в кавычках — YAML делает NO в False
    c_ppm: 0.020      # 20 ppb — повышено при онкологии лёгких
    wavelength_nm: 5263
    source: "ATS/ERS 2005, на основании выдоха онко-пациентов"

  # Альдегиды — нужно расширить MOLECULE_IDS
  # - name: C5H10O    # пентаналь — биомаркер #1 для НМРЛ
  #   c_ppb: 7.5
  #   wavelength_nm: 290
  #   source: "Phillips 2003 Table 2"
  #
  # - name: C6H12O    # гексаналь
  #   c_ppb: 5.2
  #   source: "Fuchs 2010"
  #
  # - name: C7H14O    # гептаналь
  #   c_ppb: 4.3
  #   source: "Phillips 2003"
  #
  # - name: C8H16O    # октаналь
  #   c_ppb: 3.1
  #   source: "Phillips 2003"
  #
  # - name: C9H18O    # нонаналь
  #   c_ppb: 8.2      # один из самых частых маркеров
  #   source: "Hanna 2019 meta-analysis"
