# =============================================================================
# Контрольная популяционная смесь (диагностическая группа: здоровые, μ₀)
# Дипломная работа, практическая часть, таблицы 2.2 + 2.3 + 2.4.
#
# Размерность вектора концентраций M = 16:
#   * 11 целевых биомаркеров рака лёгких — концентрации μ₀ (контроль).
#   *  3 доминирующих интерферента выдоха (H2O, CO2, O2).
#   *  2 фоновых VOC (метанол, этанол) — общий уровень для μ₀ и μ₁.
#
# Прямая модель измерения (§2.6):
#     τ(λ) = L · Σ_m c_m · α_m(λ)
# линейная в c_m. Каждый биомаркер с УФ-полосой и ИК-полосой подключён сразу
# к ДВУМ базам сечений: MPI-Mainz (УФ) + HITRAN-xsc (Sharpe/PNNL в ИК).
# Это обеспечивает корректное покрытие диапазона QD-платформы (250–2500 нм).
#
# Концентрации даны в ppb. Условия — выдох при T = 310 K, p = 1 атм; длина пути
# применяется при подаче в Spectrum через GasMixture.L_cm — конкретная длина
# зависит от прибора (10 м для FTIR, 10 см для QD; см. таблицу 2.5).
# =============================================================================

name: "Lung cancer panel — control (mu0)"
reference: |
  Концентрации μ₀ — таблица 2.2 практической части; интерференты — таблица 2.3;
  фоновые VOC — таблица 2.4. Агрегировано по обзорам Hakim 2012, Saalberg 2016
  и первичным SIFT-MS-исследованиям Phillips 1999, Turner 2007, Spanel 2007.
notes: >
  Контрольная (здоровые) популяция. CV не указывается в этом файле — это
  параметр популяционной модели вариабельности (§2.7), задаётся вне панели.

conditions:
  T_K: 310
  p_atm: 1.0
  L_cm: 10            # QD-платформа (см. таблицу 2.5); FTIR-эталон переопределяется при сборке
  diluent: {air: 1.0}

biomarkers:
  # =========================================================================
  # 11 ЦЕЛЕВЫХ БИОМАРКЕРОВ (таблица 2.2, столбец μ₀)
  # =========================================================================

  # --- Ароматические углеводороды (УФ 230-280 нм, ИК 600-6500 см⁻¹) ---
  - name: benzene
    c_ppb: 3
    sources: [mpi, hitran_xsc]
    source: "Hakim 2012, Saalberg 2016"
  - name: toluene
    c_ppb: 15
    sources: [mpi, hitran_xsc]
    source: "Poli 2005, Hakim 2012"
  - name: ethylbenzene
    c_ppb: 1
    sources: [mpi, hitran_xsc]
    source: "Hakim 2012, Saalberg 2016"
  - name: styrene
    c_ppb: 1
    sources: [mpi, hitran_xsc]
    source: "Hakim 2012, Saalberg 2016"

  # --- Карбонильные соединения (УФ 260-360 нм, ИК ~1720 см⁻¹) ---
  # Формальдегид: УФ из MPI, ИК через HITRAN line list (HCHO = M=20).
  - name: HCHO
    c_ppb: 5
    sources: [mpi, hitran]
    source: "Fuchs 2010"
    notes: "формальдегид; УФ из MPI, ИК-линии из HITRAN2020"
  - name: acetone
    c_ppb: 500
    sources: [mpi, hitran_xsc]
    source: "Turner 2007, Spanel 2007 (SIFT-MS, здоровые)"
  - name: butanone
    c_ppb: 2
    sources: [mpi, hitran_xsc]
    source: "Fuchs 2010"
    notes: "2-бутанон (метилэтилкетон, MEK)"
  - name: hexanal
    c_ppb: 5
    sources: [mpi, hitran_xsc]
    source: "Fuchs 2010"

  # --- Алифатические углеводороды (ИК только; УФ-полосы у них слабые) ---
  - name: pentane
    c_ppb: 4
    sources: [hitran_xsc]
    source: "Phillips 1999, Hakim 2012"
  - name: hexane
    c_ppb: 2
    sources: [hitran_xsc]
    source: "Hakim 2012"
  - name: isoprene
    c_ppb: 100
    sources: [mpi, hitran_xsc]
    source: "Turner 2006 (SIFT-MS longitudinal), Hakim 2012"
    notes: "Контраст μ₀ > μ₁ (обратного знака — см. μ₁-панель)."

  # =========================================================================
  # 3 ДОМИНИРУЮЩИХ ИНТЕРФЕРЕНТА (таблица 2.3)
  # =========================================================================
  # Концентрации даны как ppb (= ppm × 1000): H2O 50000 ppm → 5e7 ppb.
  - name: H2O
    c_ppb: 50000000        # ~5%
    sources: [hitran]
    source: "Ferrus 1980 (точка росы выдоха ~33-35°C)"
  - name: CO2
    c_ppb: 40000000        # ~4%
    sources: [hitran]
    source: "West 2012 (альвеолярное pCO2)"
  - name: O2
    c_ppb: 160000000       # ~16%
    sources: [hitran]
    source: "Lumb 2017, West 2012 (альвеолярное pO2)"

  # =========================================================================
  # 2 ФОНОВЫХ VOC (таблица 2.4) — одинаковы для μ₀ и μ₁
  # =========================================================================
  # Метанол: ИК ОТСУТСТВУЕТ для рабочих диапазонов FTIR-эталона (833-2500 нм) и
  # QD-платформы. HITRAN line list содержит CH3OH (M=39) только в фундаменталах
  # ~1000-3000 см⁻¹; HITRAN xsc — только в узких окнах 877-1167 и 2600-3250 см⁻¹.
  # Обертоны 4000-12000 см⁻¹ (БИК) не покрыты ни одной из доступных баз.
  # Для строгого учёта нужны PNNL-native файлы CH3OH 5/25/50°C @ 760 Torr.
  # До получения этих данных молекула исключена из вектора c — её вклад в OD
  # на обоих приборах пренебрежим (обертоны OH/CH методанола в БИК на 2-3
  # порядка слабее аналогичных полос целевых биомаркеров).
  # - name: CH3OH
  #   c_ppb: 200
  #   sources: [hitran]
  #   source: "Turner 2007, Spanel 2007 (SIFT-MS)"
  - name: ethanol
    c_ppb: 100
    sources: [hitran_xsc]
    source: "Turner 2007, Spanel 2007 (SIFT-MS)"
    notes: "этанол; фоновый, не дискриминирующий"
