# =============================================================================
# Больная популяционная смесь (диагностическая группа: рак лёгких, μ₁)
# Дипломная работа, практическая часть, таблицы 2.2 + 2.3 + 2.4.
#
# Отличается от μ₀-панели только концентрациями целевых биомаркеров; интерференты
# и фоновые VOC идентичны μ₀ (не дискриминирующие компоненты).
#
# Особо: ИЗОПРЕН в группе μ₁ СНИЖЕН (μ₁ < μ₀) — биомаркер обратного знака
# (изменение активности мевалонатного пути синтеза холестерина).
# =============================================================================

name: "Lung cancer panel — disease (mu1)"
reference: |
  Концентрации μ₁ — таблица 2.2 практической части. Агрегировано по обзорам
  Hakim 2012, Saalberg 2016 и первичным клиническим исследованиям Phillips 1999,
  Poli 2005, Fuchs 2010.
notes: >
  Популяция с раком лёгких. Биомаркеры показывают характерный контраст μ₁/μ₀;
  изопрен — обратного знака.

conditions:
  T_K: 310
  p_atm: 1.0
  L_cm: 10            # QD-платформа (см. таблицу 2.5); FTIR-эталон переопределяется при сборке
  diluent: {air: 1.0}

biomarkers:
  # =========================================================================
  # 11 ЦЕЛЕВЫХ БИОМАРКЕРОВ (таблица 2.2, столбец μ₁)
  # =========================================================================

  # --- Ароматические углеводороды ---
  - name: benzene
    c_ppb: 8
    sources: [mpi, hitran_xsc]
    source: "Hakim 2012, Saalberg 2016"
  - name: toluene
    c_ppb: 35
    sources: [mpi, hitran_xsc]
    source: "Poli 2005, Hakim 2012"
  - name: ethylbenzene
    c_ppb: 3
    sources: [mpi, hitran_xsc]
    source: "Hakim 2012, Saalberg 2016"
  - name: styrene
    c_ppb: 3
    sources: [mpi, hitran_xsc]
    source: "Hakim 2012, Saalberg 2016"

  # --- Карбонильные соединения ---
  - name: HCHO
    c_ppb: 15
    sources: [mpi, hitran]
    source: "Fuchs 2010"
    notes: "формальдегид; УФ из MPI, ИК-линии из HITRAN2020"
  - name: acetone
    c_ppb: 600
    sources: [mpi, hitran_xsc]
    source: "Hakim 2012 (изменения слабые и нестабильные)"
  - name: butanone
    c_ppb: 8
    sources: [mpi, hitran_xsc]
    source: "Fuchs 2010"
  - name: hexanal
    c_ppb: 12
    sources: [mpi, hitran_xsc]
    source: "Fuchs 2010"

  # --- Алифатические углеводороды ---
  - name: pentane
    c_ppb: 12
    sources: [hitran_xsc]
    source: "Phillips 1999, Hakim 2012"
  - name: hexane
    c_ppb: 6
    sources: [hitran_xsc]
    source: "Hakim 2012"
  - name: isoprene
    c_ppb: 60      # μ₁ < μ₀: дискриминационный признак ОБРАТНОГО знака
    sources: [mpi, hitran_xsc]
    source: "Hakim 2012, Saalberg 2016"
    notes: >
      Изопрен в группе больных снижается относительно контрольной — связано
      с изменением активности мевалонатного пути синтеза холестерина.

  # =========================================================================
  # 3 ДОМИНИРУЮЩИХ ИНТЕРФЕРЕНТА (таблица 2.3) — идентично μ₀
  # =========================================================================
  - name: H2O
    c_ppb: 50000000
    sources: [hitran]
    source: "Ferrus 1980 (точка росы выдоха ~33-35°C)"
  - name: CO2
    c_ppb: 40000000
    sources: [hitran]
    source: "West 2012 (альвеолярное pCO2)"
  - name: O2
    c_ppb: 160000000
    sources: [hitran]
    source: "Lumb 2017, West 2012 (альвеолярное pO2)"

  # =========================================================================
  # 2 ФОНОВЫХ VOC (таблица 2.4) — идентично μ₀
  # =========================================================================
  # Метанол: см. развёрнутый комментарий в mu0-панели — ИК-данные в БИК отсутствуют,
  # молекула исключена до получения PNNL-native файлов 5/25/50°C @ 760 Torr.
  # - name: CH3OH
  #   c_ppb: 200
  #   sources: [hitran]
  #   source: "Turner 2007, Spanel 2007 (SIFT-MS)"
  - name: ethanol
    c_ppb: 100
    sources: [hitran_xsc]
    source: "Turner 2007, Spanel 2007 (SIFT-MS)"
    notes: "этанол; фоновый, не дискриминирующий"
