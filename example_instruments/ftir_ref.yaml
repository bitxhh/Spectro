# =============================================================================
# Лабораторный эталон: FTIR-спектрометр ближнего ИК.
# Дипломная работа, практическая часть, раздел 2.5.1 (subsec:ftir).
#
# Типовая конфигурация коммерческих FTIR (Bruker IFS 125HR, Thermo Nicolet 6700)
# в БИК-диапазоне. Используется как «золотой стандарт» для сравнения с
# миниатюрной QD-платформой при одинаковой шумовой нагрузке (см. §2.7
# и табл. 2.6) — различие между приборами тогда определяется ИСКЛЮЧИТЕЛЬНО
# строением матрицы отклика A (разрешение, число и расположение каналов),
# а не уровнем шума.
#
# Длина оптического пути L здесь не задаётся — она часть условий смеси
# (conditions.L_cm в MixturePanel) или передаётся явно в GasMixture.with_L.
# Для FTIR-эталона штатно L = 10 м = 1000 см (многопроходная ячейка).
#
# Соответствие полей файлу spectrolib/api.py Instrument.from_dict:
#   wavelength_range  ↔ диапазон, нм
#   sampling_step     ↔ шаг сетки симуляции, нм (≤ FWHM/4 для честной свёртки)
#   ils.type          ↔ форма аппаратной функции
#   ils.fwhm          ↔ FWHM в нм
# =============================================================================

name: "FTIR reference (NIR)"
reference: |
  Griffiths & de Haseth, Fourier Transform Infrared Spectrometry (2007).
  Базовая конфигурация: Bruker IFS 125HR, Thermo Nicolet 6700.
notes: >
  Эквивалентная гауссова FWHM для проектных расчётов (§2.5.1, цитата
  Griffiths 2007, Anderson & Griffiths 1975): реальная аппаратная функция
  FTIR — аподизированный sinc (Happ-Genzel или Norton-Beer средней силы),
  но для проектных расчётов и оценок CRLB её аппроксимируют гауссианом
  эквивалентной FWHM.

  ВНИМАНИЕ к нелинейности нм↔см⁻¹: разрешение 1 см⁻¹ соответствует разной
  FWHM в нанометрах вдоль диапазона:
      λ = 833 нм:  ΔΛ ≈ 0.069 нм
      λ = 1444 нм: ΔΛ ≈ 0.208 нм   ← геометрическое среднее, выбрано здесь
      λ = 2500 нм: ΔΛ ≈ 0.625 нм
  В библиотеке GaussILS использует ОДНУ FWHM в нм; здесь зафиксирована
  величина при λ_gm = √(833·2500) ≈ 1444 нм. На коротковолновом краю
  получается перерасширение, на длинноволновом — недорасширение.
  Для прецизионных численных оценок можно разбить диапазон на сегменты
  с разной FWHM либо реализовать ILS в волновых числах (направление
  дальнейших расширений библиотеки).

# --- Спектральная сетка ---
# Диапазон: 4000-12000 см⁻¹ = 833-2500 нм (§2.5.1).
wavelength_range: [833.0, 2500.0]

# Шаг сетки симуляции: 0.05 нм даёт ≥ 4 узла на FWHM=0.208 нм при λ_gm
# (правило ≥ 5 узлов на FWHM для честной свёртки — пограничный случай,
# приемлемый для проектных расчётов; для финального продакшна можно 0.02).
# Полный размер сетки ≈ (2500-833)/0.05 ≈ 33340 точек.
sampling_step: 0.05

# --- Аппаратная функция ---
ils:
  type: gauss
  fwhm: 0.208           # нм; эквивалент 1 см⁻¹ при λ_gm = 1444 нм
